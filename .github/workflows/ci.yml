name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: composer run lint

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: composer run analyse

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      # The domain calls no WordPress function by design, so this suite runs
      # with no database anywhere in sight.
      - run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli
          tools: composer

      - run: composer install --no-interaction --no-progress

      - name: Run the integration suite
        env:
          WP_PHPUNIT__TESTS_CONFIG: tests/wp-tests-config.php
          WP_TESTS_DB_NAME: wordpress_test
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: ''
          WP_TESTS_DB_HOST: 127.0.0.1
        run: vendor/bin/phpunit --testsuite integration

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      # The only way to know the package is right is to build it and look
      # inside. This job is here because the same one on OxyArea found a plugin
      # that claimed a licence it did not ship.
      - name: Build the distributable
        run: bash scripts/build-package.sh /tmp/build

      - name: The package must carry its licence, its dependency, and no development files
        run: |
          set -e
          cd /tmp/build/oxysuppliers-for-woocommerce
          find . -type f | sed 's|^\./||' > /tmp/files.txt

          grep -qx 'LICENSE' /tmp/files.txt
          grep -qx 'readme.txt' /tmp/files.txt
          grep -qx 'oxysuppliers-for-woocommerce.php' /tmp/files.txt

          # The one runtime dependency has to be in the box: without it the PDF
          # is a fatal error on somebody else's site.
          grep -qx 'vendor/autoload.php' /tmp/files.txt
          grep -q 'vendor/dompdf/dompdf/src/Dompdf.php' /tmp/files.txt

          # The font that carries the accents, and the two families that were
          # trimmed out of the box because the document never asks for them.
          grep -q 'DejaVuSans.ttf' /tmp/files.txt
          ! grep -q 'DejaVuSerif' /tmp/files.txt
          ! grep -q 'DejaVuSansMono' /tmp/files.txt

          # And it says what is in the box: a plugin that ships a vendor
          # directory without a composer.json is one a reviewer has to take on
          # trust.
          grep -qx 'composer.json' /tmp/files.txt
          grep -qx 'composer.lock' /tmp/files.txt

          # And nothing that is only ours.
          ! grep -q '^tests/' /tmp/files.txt
          ! grep -q '^docs/' /tmp/files.txt
          ! grep -q '^scripts/' /tmp/files.txt
          ! grep -q '^\.github' /tmp/files.txt
          ! grep -q 'vendor/phpunit' /tmp/files.txt
          ! grep -q 'vendor/squizlabs' /tmp/files.txt

      - name: Say how big it is
        run: du -sh /tmp/build/oxysuppliers-for-woocommerce

  conformita:
    name: Conformita' — ogni file si compila, e le versioni coincidono
    runs-on: ubuntu-latest

    # QUELLO CHE LE PROVE NON POSSONO FARE.
    #
    # Le suite caricano quello che provano. Un file che nessuna prova tocca non
    # viene nemmeno analizzato: e' cosi' che OxyProfit e' rimasto mesi con un
    # costrutto che vuole PHP 8.2 dentro un plugin che dichiarava 8.1, con 422
    # prove unitarie verdi sopra.
    #
    # Qui si compila OGNI file, e sulla versione piu' vecchia dichiarata — che
    # e' quella su cui il plugin promette di girare, ed e' l'unica che conta per
    # questo controllo.
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: php -l su ogni file, sul PHP piu' vecchio dichiarato
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      # Quella dell'intestazione e' la versione che WordPress mostra e con cui
      # decide se c'e' un aggiornamento; quella del readme e' la versione che
      # wordpress.org pubblica. Due numeri diversi sono un aggiornamento che
      # non parte, e nessuno se ne accorge finche' non lo aspetta.
      - name: La versione e' la stessa nell'intestazione e nel readme
        run: |
          PLUGIN=$(grep -m1 -E '^ \* Version:' oxysuppliers-for-woocommerce.php \
            | sed 's/.*Version: *//' | tr -d ' \r')
          README=$(grep -m1 '^Stable tag:' readme.txt \
            | sed 's/.*Stable tag: *//' | tr -d ' \r')

          echo "intestazione: ${PLUGIN}"
          echo "readme:       ${README}"

          if [ -z "$PLUGIN" ] || [ "$PLUGIN" != "$README" ]; then
            echo "le due versioni non coincidono" >&2
            exit 1
          fi
